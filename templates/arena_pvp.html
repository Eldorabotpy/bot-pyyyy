<div id="tela-pvp-global" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; background-color: #020617; z-index: 99999;">
    
    <div id="pvp-loading" class="loading-container">
        <div class="loader-wrapper">
            <div class="loading-ring"></div>
            <div class="loading-icon">⚔️</div>
        </div>
        <h3 class="loading-title">Preparando a Arena...</h3>
    </div>

    <div id="pvp-arena" style="display: none; flex-direction: column; width: 100%; height: 100%;">
        
        <div id="pvp-arena-box" class="modern-font" style="height: 320px; width: 100%; border-radius: 12px 12px 0 0; border: 1px solid #ca8a04; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
            
            <div id="pvp-arena-background" style="position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; pointer-events: none;"></div>

            <div id="hud-oponente" style="position: absolute; top: 10px; left: 10px; width: 140px; background: rgba(15, 23, 42, 0.9); border: 1px solid #ef4444; border-radius: 8px; padding: 6px; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <span id="nome-oponente" style="color: #ef4444; font-size: 0.7em; font-weight: 800; letter-spacing: 0.5px;">RIVAL</span>
                    <span id="lvl-oponente" style="color: #fca5a5; font-size: 0.6em; font-weight: 800;">LV.??</span>
                </div>
                
                <div style="position: relative; height: 12px; background: #020617; border-radius: 3px; border: 1px solid #1e293b; overflow: hidden; margin-bottom: 4px;">
                    <div id="bar-hp-oponente" style="width: 100%; height: 100%; background: linear-gradient(90deg, #b91c1c, #ef4444); transition: width 0.3s;"></div>
                    <span id="val-hp-oponente" style="position: absolute; width: 100%; text-align: center; font-size: 0.55em; top: 0; font-weight: 900; color: #fff; text-shadow: 1px 1px #000; line-height: 11px;">0/0</span>
                </div>
            </div>

            <div id="hud-jogador-pvp" style="position: absolute; bottom: 8px; right: 8px; width: 140px; background: rgba(15, 23, 42, 0.9); border: 1px solid #3b82f6; border-radius: 8px; padding: 6px; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <span style="color: #fff; font-size: 0.7em; font-weight: 800; letter-spacing: 0.5px;">VOCÊ</span>
                    <span id="lvl-jogador-pvp" style="color: #3b82f6; font-size: 0.6em; font-weight: 800;">LV.??</span>
                </div>
                
                <div style="position: relative; height: 12px; background: #020617; border-radius: 3px; border: 1px solid #1e293b; overflow: hidden; margin-bottom: 4px;">
                    <div id="bar-hp-jogador-pvp" style="width: 100%; height: 100%; background: linear-gradient(90deg, #059669, #10b981); transition: width 0.3s;"></div>
                    <span id="val-hp-jogador-pvp" style="position: absolute; width: 100%; text-align: center; font-size: 0.55em; top: 0; font-weight: 900; color: #fff; text-shadow: 1px 1px #000; line-height: 11px;">0/0</span>
                </div>
                
                <div style="position: relative; height: 10px; background: #020617; border-radius: 3px; border: 1px solid #1e293b; overflow: hidden;">
                    <div id="bar-mp-jogador-pvp" style="width: 100%; height: 100%; background: linear-gradient(90deg, #2563eb, #3b82f6); transition: width 0.3s;"></div>
                    <span id="val-mp-jogador-pvp" style="position: absolute; width: 100%; text-align: center; font-size: 0.5em; top: 0; font-weight: 900; color: #fff; text-shadow: 1px 1px #000; line-height: 9px;">0/0</span>
                </div>
            </div>

            <img id="sprite-jogador-pvp" src="" style="position: absolute; bottom: 10px; left: 10px; height: 110px; z-index: 5; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.6));">
            <img id="sprite-oponente-pvp" class="flip-horizontal" src="" style="position: absolute; top: 60px; right: 20px; height: 110px; z-index: 4; transition: transform 0.1s; filter: drop-shadow(-2px 4px 6px rgba(0,0,0,0.6));">
            
            <div id="pvp-damage-flash" style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(231, 76, 60, 0.3); opacity: 0; pointer-events: none; z-index: 20;"></div>
            
            <div id="aviso-turno-pvp" style="position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); color: #facc15; font-family: 'Cinzel', serif; font-size: 1.5em; font-weight: bold; text-shadow: 0 4px 10px #000; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s;">
                SEU TURNO!
            </div>
        </div>

        <div id="pvp-combat-panel" class="combat-action-panel" style="background: #020617; border: 1px solid #334155; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
            <div id="pvp-caixa-logs-scroll" class="eldora-combat-log" data-combat-log role="region" aria-label="Registro do duelo">
                <div class="eldora-log-feature" data-tone="neutral"><span class="eldora-log-mark" aria-hidden="true"></span><div class="eldora-log-feature-copy"><div class="eldora-log-meta"><span class="eldora-log-eyebrow">Última ação</span><span class="eldora-log-phase" data-log-phase>Aguardando</span></div><strong class="eldora-log-title" data-log-title id="pvp-log-texto-1">Aguardando oponente...</strong><span class="eldora-log-detail" data-log-detail id="pvp-log-texto-2"></span></div><span class="eldora-log-value" data-log-value hidden><strong data-log-number></strong><small data-log-unit></small></span><span class="eldora-log-flag" data-log-flag hidden></span></div>
                <div class="eldora-log-history-heading"><span>Registro da batalha</span><span data-log-count>0 ações</span></div>
                <div class="eldora-log-history" role="log" aria-live="polite" aria-label="Ações do duelo" tabindex="0"><div class="eldora-log-empty">Os acontecimentos do duelo aparecerão aqui.</div></div>
            </div>

            <div id="pvp-menu-botoes" style="display: none; grid-template-columns: 1fr 1fr; gap: 6px;">
                <button class="modern-btn btn-atk" onclick="executarAcaoPvP('atacar')">⚔️ Atacar</button>
                <button class="modern-btn btn-mag" onclick="abrirMenuMagiasPvP()">✨ Magias</button>
                <button class="modern-btn btn-bag" onclick="abrirMenuItensPvP()">🎒 Item</button>
                <button class="modern-btn btn-run" onclick="renderSePvP()" style="background: #7f1d1d; border-color: #450a0a;">🏳️ Render-se</button>
            </div>
            
            <div id="pvp-bloqueio-turno" style="display: flex; justify-content: center; align-items: center; height: 40px; background: rgba(0,0,0,0.5); border-radius: 6px; border: 1px dashed #475569;">
                <span style="color: #94a3b8; font-style: italic;">Aguardando turno do adversário...</span>
            </div>

            <div id="pvp-botoes-fim-batalha" style="display: none;">
                <button class="modern-btn" onclick="sairDaArenaPvP()" style="width: 100%; background: #1e293b;">⬅️ Voltar ao Mapa</button>
            </div>
        </div>
    </div>
</div>
