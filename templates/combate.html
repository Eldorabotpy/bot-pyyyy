<style>
    @keyframes eldora-aura-corrompida {
        0%, 100% { filter: drop-shadow(0 0 7px rgba(168, 85, 247, .75)); }
        50% { filter: drop-shadow(0 0 17px rgba(192, 132, 252, 1)); }
    }
    #sprite-mob.mob-corrompido { animation: eldora-aura-corrompida 1.3s ease-in-out infinite; }
</style>
<div id="tela-combate-global" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; background-color: #020617; z-index: 99999;">
    
    <div id="combate-loading" class="loading-container">
        <div class="loader-wrapper">
            <div class="loading-ring"></div>
            <div class="loading-icon">⚔️</div>
        </div>
        <h3 class="loading-title">Rastreando Inimigo</h3>
    </div>

    <div id="combate-arena" style="display: none; flex-direction: column; width: 100%; height: 100%;">
        
        <div id="arena-box" class="modern-font" style="aspect-ratio: 4 / 3; width: 100%; border-radius: 12px 12px 0 0; border: 1px solid #334155; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
            
            <div id="arena-background" style="position: absolute; width: 100%; height: 100%; background-size: contain; background-position: center; pointer-events: none;"></div>

            <div id="boss-bar-container" class="mob-hud-target" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 60%; z-index: 100; pointer-events: none;">
                
                <div class="mob-hud-heading">
                    <span id="hud-nome-mob">Monstro</span>
                    <span id="hud-lvl-mob">LV.??</span>
                </div>
                <div class="mob-hud-health-track">
                    <div id="bar-hp-mob" style="width: 100%; height: 100%; background: linear-gradient(90deg, #b91c1c, #ef4444); transition: width 0.4s ease-out;"></div>
                </div>
                <div id="val-hp-mob" class="mob-hud-health-value">0/0</div>
            </div>
            <div id="grupo-combate-container" style="display:none; position:absolute; top:45px; left:8px; z-index:20; flex-direction:column; gap:5px; max-width:180px;">
            </div>
            <div id="hud-jogador" class="player-combat-hud" style="position: absolute; bottom: 8px; right: 8px; z-index: 10;">
                <div class="player-combat-hud-heading">
                    <span class="player-combat-hud-title"><span aria-hidden="true">✦</span> HERÓI</span>
                    <span id="hud-lvl-player">LV.??</span>
                </div>
                <div class="player-combat-meter player-combat-meter-hp">
                    <span class="player-combat-meter-icon" aria-hidden="true">♥</span>
                    <div class="player-combat-meter-track">
                        <div id="bar-hp-player"></div>
                        <span id="val-hp-player">0/0</span>
                    </div>
                </div>
                <div class="player-combat-meter player-combat-meter-mp">
                    <span class="player-combat-meter-icon" aria-hidden="true">◆</span>
                    <div class="player-combat-meter-track">
                        <div id="bar-mp-player"></div>
                        <span id="val-mp-player">0/0</span>
                    </div>
                </div>
            </div>

            <img id="sprite-player" src="" style="position: absolute; bottom: 10px; left: 10px; height: 110px; z-index: 5; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.6));">
            <img id="sprite-mob" src="" style="position: absolute; bottom: 60px; right: 20px; height: 100px; z-index: 4; transition: transform 0.1s;">
            
            <div id="damage-flash" style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(231, 76, 60, 0.3); opacity: 0; pointer-events: none; z-index: 20;"></div>
        </div>

        <div class="combate-painel" style="background: #020617; border: 1px solid #334155; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
            <div id="combat-log-box" class="combat-log-box eldora-combat-log" data-combat-log role="region" aria-label="Registro de combate"></div>
            <div id="menu-botoes" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                <button class="modern-btn btn-atk" onclick="executarAcaoTurno('atacar')">⚔️ Atacar</button>
                <button class="modern-btn btn-mag" onclick="abrirMenuMagias()">✨ Magias</button>
                
               <button class="modern-btn btn-bag" onclick="abrirMenuItens()">🎒 Item</button>
                
                <button class="modern-btn btn-run" onclick="executarAcaoTurno('fugir')">💨 Fugir</button>
            </div>
            
            <div id="botoes-fim-batalha" style="display: none;">
                <button class="modern-btn" onclick="sairDaArena()" style="width: 100%; background: #1e293b;">Voltar</button>
            </div>
        </div>
    </div>
</div>
