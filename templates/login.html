<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mundo de Eldora - Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap');

        body {
            margin: 0; padding: 0;
            background: url('https://raw.githubusercontent.com/Eldorabotpy/static-img/main/assets/loguin/fundo_login.jpg') center/cover no-repeat;
            background-color: #0a0514;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Cinzel', serif;
            color: #ecf0f1;
            
            /* 👇 A MÁGICA ESTÁ AQUI: Troque hidden por auto 👇 */
            overflow-y: auto; 
        }

        .portal-main-container {
            width: 90%; max-width: 340px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 2;
            margin: 20px 0; /* Impede que corte em telas pequenas do PC */
        }

        .logo-eldora {
            width: 100px; height: 100px;
            background: url('https://raw.githubusercontent.com/Eldorabotpy/static-img/main/assets/loguin/logo_eldora.png') center/contain no-repeat;
            margin-bottom: -15px;
            z-index: 10;
        }

        .login-box {
            width: 100%;
            max-width: 380px; 
            min-height: 520px;
            background-image: url('https://raw.githubusercontent.com/Eldorabotpy/static-img/main/assets/loguin/rHCxs.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            padding: 110px 60px 50px 60px; 
            box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }

        .input-container { width: 100%; margin-bottom: 8px; text-align: left; }
        .input-container label { font-size: 0.65em; color: #d4af37; margin-left: 5px; display: block; margin-bottom: 3px; letter-spacing: 1px; }

        .input-container input, .input-container select {
            width: 100%; height: 40px;
            background: url('https://raw.githubusercontent.com/Eldorabotpy/static-img/main/assets/loguin/log_senha.png') center/100% 100% no-repeat;
            background-color: transparent; border: none; outline: none; padding: 0 15px; box-sizing: border-box;
            color: #d4af37; font-family: 'Georgia', serif; font-size: 1em; font-weight: bold;
        }

        .btn-new {
            width: 90%; height: 42px; margin: 10px auto 0 auto;
            background: url('https://raw.githubusercontent.com/Eldorabotpy/static-img/main/assets/loguin/botao_dourado.png') center/100% 100% no-repeat;
            background-color: transparent; border: none; color: #3b2400; font-weight: 900; font-size: 0.85em;
            cursor: pointer; text-transform: uppercase; display: flex; justify-content: center; align-items: center;
            font-family: 'Cinzel', serif;
        }
        
        .btn-new:active { transform: scale(0.96); filter: brightness(0.9); }

        .btn-personagem {
            width: 100%; height: 45px; margin-bottom: 10px;
            background: rgba(26, 11, 46, 0.8); border: 1px solid #d4af37; color: #ecf0f1;
            font-family: 'Cinzel', serif; font-weight: bold; cursor: pointer; border-radius: 5px;
        }
        .btn-personagem:hover { background: rgba(212, 175, 55, 0.2); }

        .texto-rodape { margin-top: 15px; font-size: 0.9em; color: #ecf0f1; text-align: center; font-family: 'Segoe UI', sans-serif; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        .texto-rodape span { color: #d4af37; cursor: pointer; font-weight: bold; }
    
        /* NOTIFICAÇÃO ESTILIZADA */
        #custom-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center;
        }
        .alert-box {
            width: 80%; max-width: 300px; background: #1a0b2e; border: 2px solid #d4af37;
            border-radius: 10px; padding: 25px; text-align: center; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .alert-title { color: #d4af37; font-family: 'Cinzel', serif; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        .alert-message { color: #ecf0f1; font-family: 'Georgia', serif; font-size: 0.95em; margin-bottom: 20px; line-height: 1.4; }
        .btn-alert {
            width: 100px; height: 35px; background: url('https://raw.githubusercontent.com/Eldorabotpy/static-img/main/assets/loguin/botao_dourado.png') center/100% 100% no-repeat;
            border: none; color: #3b2400; font-weight: bold; cursor: pointer; font-family: 'Cinzel', serif;
        }
        
        #lista-personagens { 
            width: 100%; max-height: 280px; overflow-y: auto; 
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; padding-right: 5px;
        }
        #lista-personagens::-webkit-scrollbar { width: 6px; }
        #lista-personagens::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        #lista-personagens::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
    
        .card-heroi {
            width: 100%; background: linear-gradient(90deg, rgba(26, 11, 46, 0.9), rgba(10, 5, 20, 0.9));
            border: 1px solid #d4af37; border-radius: 8px; padding: 10px; box-sizing: border-box;
            display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
    
        .card-heroi:hover { background: linear-gradient(90deg, rgba(46, 20, 80, 0.9), rgba(26, 11, 46, 0.9)); transform: scale(1.02); }
        .card-heroi:active { transform: scale(0.98); }

        .card-heroi-avatar {
            width: 50px; height: 50px; border-radius: 8px; border: 2px solid #b8860b;
            background: #000; object-fit: cover; flex-shrink: 0;
        }

        .card-heroi-info { display: flex; flex-direction: column; align-items: flex-start; flex-grow: 1; }
        .card-heroi-nome { color: #fff; font-family: 'Cinzel', serif; font-size: 1.1em; font-weight: bold; text-shadow: 1px 1px 2px #000; margin-bottom: 3px; }
        
        .card-heroi-detalhes { display: flex; align-items: center; gap: 8px; font-family: 'Georgia', serif; font-size: 0.75em; color: #cbd5e1; }
        .badge-nivel { background: #d4af37; color: #3b2400; padding: 2px 6px; border-radius: 4px; font-weight: 900; }

        /* =====================================================
           CONTAS SALVAS / AUTOFILL
           ===================================================== */

        .input-container input:-webkit-autofill,
        .input-container input:-webkit-autofill:hover,
        .input-container input:-webkit-autofill:focus,
        .input-container input:-webkit-autofill:active {
            -webkit-text-fill-color: #d4af37 !important;
            caret-color: #d4af37 !important;
            -webkit-box-shadow: 0 0 0 1000px #180d25 inset !important;
            box-shadow: 0 0 0 1000px #180d25 inset !important;
            transition: background-color 9999s ease-out 0s;
        }

        #contas-salvas-box {
            width: 100%;
            margin-bottom: 10px;
            display: none;
        }

        .contas-salvas-titulo {
            color: #d4af37;
            font-size: 0.62em;
            letter-spacing: 1px;
            margin: 0 0 5px 5px;
        }

        #lista-contas-salvas {
            width: 100%;
            max-height: 135px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 3px;
            box-sizing: border-box;
        }

        #lista-contas-salvas::-webkit-scrollbar {
            width: 5px;
        }

        #lista-contas-salvas::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }

        .conta-salva {
            width: 100%;
            min-height: 34px;
            padding: 4px 7px 4px 10px;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            gap: 7px;

            background: rgba(15, 7, 27, 0.92);
            border: 1px solid rgba(212, 175, 55, 0.55);
            border-radius: 5px;

            color: #ecf0f1;
            cursor: pointer;
        }

        .conta-salva:hover {
            background: rgba(212, 175, 55, 0.13);
        }

        .conta-salva-nome {
            flex: 1;
            min-width: 0;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-family: 'Georgia', serif;
            font-size: 0.85em;
            font-weight: bold;
        }

        .conta-salva-ultima {
            padding: 2px 5px;
            border-radius: 4px;

            background: #d4af37;
            color: #3b2400;

            font-size: 0.48em;
            font-weight: 900;
        }

        .conta-salva-remover {
            width: 24px;
            height: 24px;

            padding: 0;
            border: none;
            border-radius: 4px;

            background: rgba(120, 25, 25, 0.55);
            color: #ffb4b4;

            font-weight: bold;
            cursor: pointer;
        }

        .salvar-conta-opcao {
            width: 100%;
            margin: 4px 0 2px;

            display: flex;
            align-items: center;
            gap: 6px;

            color: #c9c2d1;
            font-family: 'Georgia', serif;
            font-size: 0.72em;
        }

        .salvar-conta-opcao input {
            accent-color: #d4af37;
        }
    </style>
    
</head>
<body>
    
    <body>
    <!-- TELA DE CARREGAMENTO -->
    
    <!-- MODAL DE ALERTA -->
    <div id="custom-alert">
        <div class="alert-box">
            <div class="alert-title" id="alert-title">AVISO</div>
            <div class="alert-message" id="alert-message">Mensagem...</div>
            <button class="btn-alert" onclick="fecharAlerta()">OK</button>
        </div>
    </div>

    <div class="portal-main-container">
        <div class="logo-eldora"></div>
        <div class="login-box">
            <div class="titulo-secao" id="titulo-caixa" style="margin-bottom: 10px; color: #d4af37; font-size: 0.9em; font-weight: bold;">ENTRAR NO REINO</div>
            
            <!-- ETAPA 1: TELA LOGIN DA CONTA MESTRA -->
            <div id="tela-login" style="width: 100%;">

                <div id="contas-salvas-box">
                    <div class="contas-salvas-titulo">CONTAS SALVAS</div>
                    <div id="lista-contas-salvas"></div>
                </div>

                <div class="input-container">
                    <label>CONTA (USUÁRIO)</label>
                    <input
                        type="text"
                        id="login-username"
                        placeholder="Sua conta..."
                        autocomplete="username"
                    >
                </div>
            
                <div class="input-container">
                    <label>SENHA DA CONTA</label>
                    <input
                        type="password"
                        id="login-password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                </div>

                <label class="salvar-conta-opcao">
                    <input type="checkbox" id="login-salvar-conta" checked>
                    Salvar esta conta neste dispositivo
                </label>
                <button class="btn-new" onclick="playClick(); realizarLogin()" id="btn-logar">ACESSAR CONTA</button>
            </div>
            
            <!-- ETAPA 1.5: TELA DE CRIAR CONTA MESTRA -->
            <div id="tela-registro-conta" style="display: none; width: 100%;">
                <div class="input-container"><label>NOVO USUÁRIO</label><input type="text" id="reg-conta-user" placeholder="Sua conta..."></div>
                <div class="input-container"><label>CRIAR SENHA</label><input type="password" id="reg-conta-pass" placeholder="Mínimo 6 caracteres"></div>
                <button class="btn-new" onclick="playClick(); criarContaMestra()" id="btn-criar-conta">CRIAR CONTA</button>
                <div style="text-align: center; margin-top: 10px;">
                    <span onclick="playClick(); alternarParaLogin()" style="color: #ecf0f1; font-size: 0.8em; cursor: pointer; text-decoration: underline;">Voltar ao Login</span>
                </div>
            </div>

            <!-- ETAPA 2: TELA DE SELEÇÃO DE PERSONAGENS (LOBBY) -->
            <div id="tela-selecao" style="display: none; width: 100%; text-align: center;">
                <div style="font-size: 0.7em; color: #ecf0f1; margin-bottom: 10px;">Selecione seu herói:</div>
                <div id="lista-personagens">
                    <!-- Os botões dos personagens aparecerão aqui via JavaScript -->
                </div>
                <button class="btn-new" onclick="playClick(); mostrarCriacao()" style="margin-top: 5px;">+ CRIAR NOVO HERÓI</button>
            </div>

            <!-- ETAPA 3: TELA DE CRIAÇÃO (APENAS NOME E GÊNERO) -->
            <div id="tela-criacao" style="display: none; width: 100%;">
                <div class="input-container"><label>NOME DO NOVO HERÓI</label><input type="text" id="reg-heroiname" placeholder="Nome desejado..."></div>
                <div class="input-container">
                    <label>GÊNERO</label>
                    <select id="reg-genero">
                        <option value="masculino" style="background: #1a0b2e;">Masculino ♂️</option>
                        <option value="feminino" style="background: #1a0b2e;">Feminino ♀️</option>
                    </select>
                </div>
                <button class="btn-new" onclick="playClick(); confirmarCriacao()" id="btn-criar">FORJAR DESTINO</button>
                <div style="text-align: center; margin-top: 10px;">
                    <span onclick="playClick(); voltarParaSelecao()" style="color: #ecf0f1; font-size: 0.8em; cursor: pointer; text-decoration: underline;">Voltar</span>
                </div>
            </div>
        </div>

        <div class="texto-rodape" id="rodape-dinamico">
            Nova Conta? <span onclick="playClick(); alternarParaRegistroConta()">Criar Conta.</span>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const clickSound = new Audio("https://github.com/user-attachments/files/26343084/dragon-studio-clicking-433009.mp3");
        window.playClick = function() { clickSound.currentTime = 0; clickSound.play().catch(e => {}); };

        // --- MOTOR DE NOTIFICAÇÃO ---
        window.mostrarAviso = function(titulo, mensagem) {
            document.getElementById('alert-title').innerText = titulo;
            document.getElementById('alert-message').innerText = mensagem;
            document.getElementById('custom-alert').style.display = 'flex';
        };

        window.fecharAlerta = function() {
            document.getElementById('custom-alert').style.display = 'none';
        };

        // Variável global para guardar o Token/Sessão da conta mestra
        let contaAtiva = null;

        // ==========================================
        // 💾 CONTAS SALVAS PARA TESTES
        // ==========================================

        const CHAVE_CONTAS_SALVAS = "eldora_contas_salvas";
        const CHAVE_ULTIMA_CONTA = "eldora_ultima_conta";

        function obterContasSalvas() {
            try {
                const dados = JSON.parse(
                    localStorage.getItem(CHAVE_CONTAS_SALVAS) || "[]"
                );

                return Array.isArray(dados) ? dados : [];
            } catch (e) {
                return [];
            }
        }

        function salvarContaLocal(username, password) {
            let contas = obterContasSalvas();

            const existente = contas.find(
                c => c.username.toLowerCase() === username.toLowerCase()
            );

            if (existente) {
                existente.username = username;
                existente.password = password;
            } else {
                contas.push({
                    username: username,
                    password: password
                });
            }

            localStorage.setItem(
                CHAVE_CONTAS_SALVAS,
                JSON.stringify(contas)
            );

            localStorage.setItem(
                CHAVE_ULTIMA_CONTA,
                username
            );

            renderizarContasSalvas();
        }

        function removerContaSalva(username) {
            let contas = obterContasSalvas();

            contas = contas.filter(
                c => c.username.toLowerCase() !== username.toLowerCase()
            );

            localStorage.setItem(
                CHAVE_CONTAS_SALVAS,
                JSON.stringify(contas)
            );

            if (
                localStorage.getItem(CHAVE_ULTIMA_CONTA)?.toLowerCase() ===
                username.toLowerCase()
            ) {
                localStorage.removeItem(CHAVE_ULTIMA_CONTA);
            }

            renderizarContasSalvas();
        }

        window.entrarComContaSalva = function(username, password) {
            document.getElementById("login-username").value = username;
            document.getElementById("login-password").value = password;

            realizarLogin();
        };

        function renderizarContasSalvas() {
            const box = document.getElementById("contas-salvas-box");
            const lista = document.getElementById("lista-contas-salvas");

            if (!box || !lista) return;

            const contas = obterContasSalvas();
            const ultima = localStorage.getItem(CHAVE_ULTIMA_CONTA);

            lista.innerHTML = "";

            if (contas.length === 0) {
                box.style.display = "none";
                return;
            }

            box.style.display = "block";

            contas
                .sort((a, b) => {
                    if (a.username === ultima) return -1;
                    if (b.username === ultima) return 1;

                    return a.username.localeCompare(b.username);
                })
                .forEach(conta => {

                    const item = document.createElement("div");
                    item.className = "conta-salva";

                    const nome = document.createElement("div");
                    nome.className = "conta-salva-nome";
                    nome.textContent = conta.username;

                    item.appendChild(nome);

                    if (conta.username === ultima) {
                        const badge = document.createElement("span");
                        badge.className = "conta-salva-ultima";
                        badge.textContent = "ÚLTIMA";
                        item.appendChild(badge);
                    }

                    const remover = document.createElement("button");
                    remover.type = "button";
                    remover.className = "conta-salva-remover";
                    remover.textContent = "×";

                    remover.onclick = function(event) {
                        event.stopPropagation();
                        removerContaSalva(conta.username);
                    };

                    item.onclick = function() {
                        entrarComContaSalva(
                            conta.username,
                            conta.password
                        );
                    };

                    item.appendChild(remover);
                    lista.appendChild(item);
                });
        }

        // AÇÃO: O JOGADOR CLICOU NO PERSONAGEM PARA JOGAR
        window.entrarNoMapaComPersonagem = function(id, nome, genero) {
            try {
                if (typeof playClick === "function") playClick();
            } catch(e) {}

            const titulo = document.getElementById('titulo-caixa');
            if (titulo) titulo.innerText = "ENTRANDO NO REINO... ⏳";

            try {
                // Limpa o cache se for um boneco diferente
                const idAntigo = localStorage.getItem("jogadorEldoraID");
                if (idAntigo && idAntigo !== String(id)) {
                    localStorage.removeItem("eldora_lastX");
                    localStorage.removeItem("eldora_lastY");
                    localStorage.removeItem("eldora_lastRegiao");
                }

                // Salva os dados do boneco escolhido
                localStorage.setItem("jogadorEldoraID", String(id));
                localStorage.setItem("jogadorEldoraNome", String(nome));
                localStorage.setItem("generoEscolhido", String(genero) || 'masculino');
                
                // Força a ida pro mapa!
                window.location.href = '/'; 

            } catch (erro) {
                alert("⚠️ Erro no navegador: " + erro.message);
            }
        };

        // ETAPA 1: FAZER LOGIN NA CONTA MESTRA
        window.realizarLogin = async function() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            if (!user || !pass) return mostrarAviso("AVISO", "⚠️ Preencha usuário e senha da conta!");

            const btn = document.getElementById('btn-logar');
            btn.innerText = "Sincronizando..."; btn.disabled = true;

            try {
                // Aqui você mantém a sua rota de login do backend. 
                // O backend deve retornar que o login foi sucesso e (idealmente) a lista de personagens dessa conta.
                const res = await fetch('/api/portal/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                
                if (data.sucesso) {

                    contaAtiva = user;

                    const salvarConta =
                        document.getElementById("login-salvar-conta")?.checked;

                    if (salvarConta) {
                        salvarContaLocal(user, pass);
                    } else {
                        localStorage.setItem(
                            CHAVE_ULTIMA_CONTA,
                            user
                        );

                        renderizarContasSalvas();
                    }
                    document.getElementById('tela-login').style.display = 'none';
                    document.getElementById('rodape-dinamico').style.display = 'none';
                    
                    // Vai para a etapa 2: Mostrar os personagens
                    buscarPersonagens(data.personagens || []); 
                } else {
                    mostrarAviso("ACESSO NEGADO", "❌ " + data.erro);
                    btn.innerText = "ACESSAR CONTA"; btn.disabled = false;
                }
            } catch (e) {
                mostrarAviso("ERRO", "⚠️ Falha na conexão com o Reino.");
                btn.innerText = "ACESSAR CONTA"; btn.disabled = false;
            }
        };

        // ETAPA 2: MOSTRAR LISTA DE PERSONAGENS
        // ETAPA 2: MOSTRAR LISTA DE PERSONAGENS COM AVATAR E LEVEL
        window.buscarPersonagens = function(listaPersonagens) {
            document.getElementById('titulo-caixa').innerText = "SELECIONE SEU DESTINO";
            document.getElementById('tela-selecao').style.display = 'block';
            
            const divLista = document.getElementById('lista-personagens');
            divLista.innerHTML = "";

            if (!listaPersonagens || listaPersonagens.length === 0) {
                divLista.innerHTML = "<div style='color:#ecf0f1; font-size: 0.8em; padding: 20px 0;'>Nenhum herói encontrado nesta conta.<br>Forje seu destino criando um novo!</div>";
            } else {
                const LINK_BASE_GITHUB = "https://raw.githubusercontent.com/Eldorabotpy/static-img/main/assets/avatares/";
                
                listaPersonagens.forEach(p => {
                    // 1. Tratamento de Nível e Classe (com proteções contra valores vazios)
                    const nivel = p.level || p.nivel || 1;
                    const classeName = p.classe || "Aventureiro";
                    
                    // 2. Lógica do Avatar (Baseada no perfil.js e perfil_visual.js)
                    let generoCurto = (p.genero && p.genero.toLowerCase() === 'feminino') ? 'f' : 'm';
                    let imgUrl = '';
                    let avatarId = p.avatar_customizado || p.avatar;

                    if (avatarId && avatarId.startsWith('http')) {
                        // Se o banco salvou um link direto
                        imgUrl = avatarId;
                    } else if (avatarId && avatarId !== 'padrao') {
                        // Se tem um avatar específico customizado
                        imgUrl = `${LINK_BASE_GITHUB}${avatarId}.png`;
                        // Se for um ID que começa com "avatar_", remove para não duplicar se a regra mudar
                        if (!imgUrl.includes("avatar_avatar_")) {
                           imgUrl = imgUrl.replace("avatares/", "avatares/avatar_"); 
                        }
                    } else {
                        // Avatar Padrão baseado na classe e gênero
                        let classeId = classeName.toLowerCase().replace(" ", "_");
                        imgUrl = `${LINK_BASE_GITHUB}avatar_${classeId}_${generoCurto}.png`;
                    }

                    // Fallback de erro da imagem (Se falhar, carrega o padrão masculino ou feminino)
                    const fallbackImg = `${LINK_BASE_GITHUB}avatar_padrao_${generoCurto}.png`;

                    // 3. Constrói o HTML do Card
                    let divCard = document.createElement('div');
                    divCard.className = 'card-heroi';
                    divCard.onclick = () => entrarNoMapaComPersonagem(p.id, p.nome, p.genero);
                    
                    divCard.innerHTML = `
                        <img src="${imgUrl}" class="card-heroi-avatar" onerror="this.onerror=null; this.src='${fallbackImg}';">
                        <div class="card-heroi-info">
                            <div class="card-heroi-nome">${p.nome}</div>
                            <div class="card-heroi-detalhes">
                                <span class="badge-nivel">Nv. ${nivel}</span>
                                <span>${classeName}</span>
                            </div>
                        </div>
                    `;
                    
                    divLista.appendChild(divCard);
                });
            }
        };

        // NAVEGAÇÃO: IR PARA TELA DE CRIAR NOVO
        window.mostrarCriacao = function() {
            document.getElementById('tela-selecao').style.display = 'none';
            document.getElementById('tela-criacao').style.display = 'block';
            document.getElementById('titulo-caixa').innerText = "CRIAR NOVO HERÓI";
        };

        // NAVEGAÇÃO: VOLTAR PARA SELEÇÃO
        window.voltarParaSelecao = function() {
            document.getElementById('tela-criacao').style.display = 'none';
            document.getElementById('tela-selecao').style.display = 'block';
            document.getElementById('titulo-caixa').innerText = "SEUS HERÓIS";
        };

        // ETAPA 3: CRIAR NOVO PERSONAGEM NA CONTA
        window.confirmarCriacao = async function() {
            const nome = document.getElementById('reg-heroiname').value;
            const genero = document.getElementById('reg-genero').value;
            
            if (!nome) return mostrarAviso("AVISO", "⚠️ Dê um nome ao seu herói.");

            const btn = document.getElementById('btn-criar');
            btn.innerText = "Forjando..."; btn.disabled = true;

            try {
                // Note que aqui não enviamos mais "senha". Enviamos a conta ativa à qual o personagem pertence.
                const res = await fetch('/api/portal/criar_personagem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conta: contaAtiva,
                        nome: nome, 
                        genero: genero
                    })
                });
                const data = await res.json();
                
                if (data.sucesso) {
                    mostrarAviso("HERÓI FORJADO", "✨ " + nome + " está pronto para a aventura!");
                    document.getElementById('reg-heroiname').value = ''; // limpa o campo
                    
                    // Volta pra tela de seleção passando a nova lista atualizada vinda do servidor
                    document.getElementById('tela-criacao').style.display = 'none';
                    buscarPersonagens(data.nova_lista_personagens || []);
                } else {
                    mostrarAviso("ERRO", "❌ " + data.erro);
                }
            } catch (e) {
                mostrarAviso("ERRO", "⚠️ Falha ao criar herói.");
            }
            btn.innerText = "FORJAR DESTINO"; btn.disabled = false;
        };
        // NAVEGAÇÃO: IR PARA TELA DE REGISTRAR CONTA
        window.alternarParaRegistroConta = function() {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-registro-conta').style.display = 'block';
            document.getElementById('rodape-dinamico').style.display = 'none';
            document.getElementById('titulo-caixa').innerText = "NOVA CONTA MESTRA";
        };

        // NAVEGAÇÃO: VOLTAR PARA O LOGIN
        window.alternarParaLogin = function() {
            document.getElementById('tela-registro-conta').style.display = 'none';
            document.getElementById('tela-login').style.display = 'block';
            document.getElementById('rodape-dinamico').style.display = 'block';
            document.getElementById('titulo-caixa').innerText = "ENTRAR NO REINO";
        };

        // AÇÃO: ENVIAR DADOS DE NOVA CONTA PRO SERVIDOR
        window.criarContaMestra = async function() {
            const user = document.getElementById('reg-conta-user').value;
            const pass = document.getElementById('reg-conta-pass').value;
            
            if (!user || pass.length < 6) return mostrarAviso("AVISO", "⚠️ Preencha usuário e senha (mín. 6 chars).");

            const btn = document.getElementById('btn-criar-conta');
            btn.innerText = "Forjando..."; btn.disabled = true;

            try {
                // Nova rota no seu backend para salvar a conta mestra
                const res = await fetch('/api/portal/criar_conta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tg_id: window.Telegram.WebApp.initDataUnsafe?.user?.id || 12345, 
                        username: user, 
                        password: pass
                    })
                });
                const data = await res.json();
                
                if (data.sucesso) {
                    mostrarAviso("CONTA CRIADA", "✨ Sua Conta Mestra foi forjada! Faça o login agora.");
                    document.getElementById('reg-conta-user').value = '';
                    document.getElementById('reg-conta-pass').value = '';
                    alternarParaLogin();
                } else {
                    mostrarAviso("ERRO", "❌ " + data.erro);
                }
            } catch (e) {
                mostrarAviso("ERRO", "⚠️ Falha ao criar conta.");
            }
            btn.innerText = "CRIAR CONTA"; btn.disabled = false;
        };

                // ==========================================
        // INICIALIZA CONTAS SALVAS
        // ==========================================

        document.addEventListener("DOMContentLoaded", function() {

            renderizarContasSalvas();

            const ultima =
                localStorage.getItem(CHAVE_ULTIMA_CONTA);

            if (!ultima) return;

            const conta =
                obterContasSalvas().find(
                    c => c.username === ultima
                );

            if (!conta) return;

            const campoUsuario =
                document.getElementById("login-username");

            if (campoUsuario) {
                campoUsuario.value = conta.username;
            }
        });
        
    </script>
</body>
</html>
