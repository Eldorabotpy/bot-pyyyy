    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    background: rgba(0,0,0,0.85); 
    z-index: 9999999; 
    display: flex; 
    justify-content: center; 
    align-items: center;
    backdrop-filter: blur(6px); 
}

.forja-modern-wrapper {

    border: 1px solid #ca8a04;

    font-size: 1.1em;
}

.forja-close {

    border: none;

}

}

.aba-forja-btn:hover {
    border-color: #facc15;

}

.aba-forja-btn.active {

.card-icon {

.btn-forge-action {

    font-size: 1.1em;

    transition: 0.2s;
}
.btn-forge-action:hover:not(:disabled) { background: linear-gradient(180deg, #eab308, #ca8a04); transform: translateY(-2px); }
