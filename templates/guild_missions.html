<div id="guild-missions-container" class="guild-overlay" style="display:none;">
  <div class="guild-modal" role="dialog" aria-modal="true" aria-labelledby="guild-titulo-principal">
    <button type="button" class="guild-fechar" aria-label="Fechar guilda" onclick="window.fecharGuildaMissoes()">×</button>
    <div id="guild-titulo-principal" class="guild-titulo">Guilda dos Aventureiros</div>
    <div id="guild-atendente-area" class="guild-atendente-area">
      <img id="guild-atendente-img" class="guild-atendente-img" src="https://raw.githubusercontent.com/Eldorabotpy/static-img/main/assets/npcs/atendente_guilda.png" alt="Lyria">
      <div class="guild-dialogo"><div class="guild-dialogo-nome">LYRIA · ESCRIVÃ DA GUILDA</div><div id="guild-dialogo-texto" role="status">Escolha seu próximo contrato.</div></div>
    </div>
    <div id="guild-pontos-area" class="guild-pontos">Consultando saldo…</div>
    <div id="guild-secao-area" class="guild-abas guild-secao-principal">
      <button class="guild-aba ativa" data-guild-destino="individual" onclick="window.navegarGuilda('individual')">Pessoais</button>
      <button class="guild-aba" data-guild-destino="coletivo" onclick="window.navegarGuilda('coletivo')">Do clã</button>
      <button class="guild-aba" data-guild-destino="loja" onclick="window.navegarGuilda('loja')">Loja</button>
    </div>
    <div id="guild-abas-area" class="guild-abas">
      <button id="guild-aba-disponiveis" class="guild-aba ativa" onclick="window.mudarAbaGuildaMissoes('disponiveis')">Disponíveis</button>
      <button id="guild-aba-ativas" class="guild-aba" onclick="window.mudarAbaGuildaMissoes('ativas')">Em andamento</button>
      <button id="guild-aba-concluidas" class="guild-aba" onclick="window.mudarAbaGuildaMissoes('concluidas')">Histórico</button>
    </div>
    <div class="guild-toolbar">
      <label id="guild-filtros-area">Tipo <select id="guild-filtro-select" onchange="window.filtrarGuildaMissoes(this.value)"><option value="todos">Todos os contratos</option><option value="pessoal">Pessoal</option><option value="cla">Vinculado ao clã</option></select></label>
      <button class="guild-refresh" onclick="window.atualizarPainelGuilda()" aria-label="Atualizar missões">↻ Atualizar</button>
    </div>
    <div id="guild-missoes-lista" class="guild-missoes-lista"><div class="guild-carregando">Consultando contratos…</div></div>
  </div>
</div>
